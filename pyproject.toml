[project]
name = "hololive-dreams-auto-high-low"
version = "1.1.1"
description = "Automated 5-Card Draw poker solver, High-Low card-counting bot, Observer Mode companion, and Monte Carlo simulator for Hololive Dreams"
readme = "README.md"
requires-python = ">=3.10"

[tool.coverage.run]
source = ["src", "main_ui"]
omit = [
    "tests/*",
    "scratch/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E402",  # Module level import not at top of file (sys.path manipulation required before internal imports)
]
