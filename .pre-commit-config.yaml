repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|cmd)$
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: localization-parity
        name: localization parity check
        entry: python -m unittest tests/test_localization.py
        language: system
        pass_filenames: false
        files: ^(locales/.*\.json|src/localization\.py|tests/test_localization\.py)$
